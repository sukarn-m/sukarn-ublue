name: build-others
on:
  schedule:
    - cron: "30 6 1,15 * *" # Set in UTC: 6:30 AM on 1st and 15th day of each month.

  push:
    paths:
      - recipes/image-budgie.yml
      - recipes/image-cosmic.yml
      - .github/workflows/build-others.yml
#      - files/scripts/image_name-v.sh
#      - files/scripts/image_name-s.sh
#      - files/theme-v/**
#      - files/theme-s/**
#      - files/system/**
#      - files/laptop/**

  workflow_dispatch: # allow manually triggering builds

jobs:
  bluebuild:
    name: Budgie Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          - image-budgie.yml
          - image-cosmic.yml
    steps:
      # See build-gnome.yml: runner image 20260810+ pins fuse-overlayfs 1.16,
      # which corrupted rechunked files-module overwrites. Keep all podman
      # storage on native overlayfs.
      - name: Force native overlayfs (remove fuse-overlayfs)
        run: |
          sudo rm -f /usr/local/bin/fuse-overlayfs /usr/bin/fuse-overlayfs
          sudo sed -i -E 's/^[[:space:]]*(mount_program|mountopt)[[:space:]]*=.*/# \1 disabled: fuse-overlayfs 1.16 corrupts rechunked images/' /etc/containers/storage.conf 2>/dev/null || true
          mkdir -p "$HOME/.config/containers"
          printf '[storage]\ndriver = "overlay"\n' > "$HOME/.config/containers/storage.conf"

       # the build is fully handled by the reusable github action
      - name: Build Custom Image
        uses: blue-build/github-action@v1.12
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          # enabled by default, disable if your image is small and you want faster builds      
          maximize_build_space: true
          
          # Optional flags
          use_unstable_cli: false
          # chunkah (coreos/chunkah) replaces the deprecated hhd-dev/rechunk;
          # skipped on PRs like rechunk was
          chunkah: ${{ github.event_name != 'pull_request' }}
#          squash: true

  # Fail the build loudly if files-module content in the pushed image does not
  # match the repo tree (see build-gnome.yml for the incident this guards against).
  # Runs only where :latest is the real target (main/schedule/dispatch).
  verify:
    name: Verify files in ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: bluebuild
    if: github.event_name != 'pull_request' && (github.event_name != 'push' || github.ref == 'refs/heads/main')
    permissions:
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # laptop-overrides.sh legitimately rewrites these two drop-ins after
          # the files module, so they cannot be compared against the repo tree
          - recipe: image-budgie.yml
            image: ghcr.io/sukarn-m/sukarn-ublue-budgie
            sources: system laptop theme-v
            exclude: /etc/systemd/system/rpm-ostreed-automatic.service.d/override.conf /etc/systemd/system/rpm-ostreed-automatic.timer.d/override.conf
          - recipe: image-cosmic.yml
            image: ghcr.io/sukarn-m/sukarn-ublue-cosmic
            sources: system laptop theme-s
            exclude: /etc/systemd/system/rpm-ostreed-automatic.service.d/override.conf /etc/systemd/system/rpm-ostreed-automatic.timer.d/override.conf
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Verify files-module content
        env:
          IMAGE: ${{ matrix.image }}
          SOURCES: ${{ matrix.sources }}
          EXCLUDE: ${{ matrix.exclude }}
          TAG: latest
        run: |
          set -euo pipefail
          expected="$(mktemp)"
          for src in $SOURCES; do
            (cd "files/$src" && find . -type f -print0 | sort -z | xargs -0 sha256sum | sed 's~  \./~  /~') >> "$expected"
          done
          for ex in ${EXCLUDE:-}; do
            grep -v "  ${ex}$" "$expected" > "$expected.f" || true
            mv "$expected.f" "$expected"
          done
          echo "Verifying $(wc -l < "$expected") files from sources: $SOURCES"
          podman pull "$IMAGE:$TAG"
          podman run --rm -i --entrypoint /usr/bin/bash "$IMAGE:$TAG" -c 'sha256sum -c --quiet' < "$expected"
          echo "All files-module content verified OK"
