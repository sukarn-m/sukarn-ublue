name: build-gnome
on:
  schedule:
    - cron: "30 06 * * 0" # Set in UTC: 6:30 AM on Sunday.

  push:
    paths-ignore:
      - "**.md"
      - "recipes/image-budgie.yml"
      - "recipes/image-cosmic.yml"
      - "make-*-iso.sh"
      - ".github/workflows/build-others.yml"
      - ".github/workflows/clean-workflows.yml"
      - "files/theme-v/**"


  workflow_dispatch: # allow manually triggering builds

#  repository_dispatch: # allow trigerring through another repository
jobs:
  bluebuild:
    name: Gnome Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          - image-desktop.yml
          - image-laptop.yml
    steps:
      # GitHub's ubuntu-24.04 runner image 20260810+ ships fuse-overlayfs 1.16
      # and pins it as mount_program in /etc/containers/storage.conf. Rechunk's
      # rootful containers then commit the image tree through the FUSE overlay,
      # corrupting every files-module override of a lower-layer file (old content
      # zero-padded to the new size). See containers/fuse-overlayfs#475 and
      # actions/runner-images#14597. Removing the binary and its config pin
      # forces kernel-native overlayfs and produces clean images (verified).
      - name: Force native overlayfs (remove fuse-overlayfs)
        run: |
          sudo rm -f /usr/local/bin/fuse-overlayfs /usr/bin/fuse-overlayfs
          sudo sed -i -E 's/^[[:space:]]*(mount_program|mountopt)[[:space:]]*=.*/# \1 disabled: fuse-overlayfs 1.16 corrupts rechunked images/' /etc/containers/storage.conf 2>/dev/null || true
          mkdir -p "$HOME/.config/containers"
          printf '[storage]\ndriver = "overlay"\n' > "$HOME/.config/containers/storage.conf"

       # the build is fully handled by the reusable github action
      - name: Build Custom Image
        uses: blue-build/github-action@v1.12
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          # enabled by default, disable if your image is small and you want faster builds      
          maximize_build_space: true
          
          # Optional flags
          use_unstable_cli: false
#          squash: true
          rechunk: ${{ github.event_name != 'pull_request' }}
      # start device-specific builds
#      - name: Build Device Specific Images
#        run: |
#          curl -X POST https://api.github.com/repos/sukarn-m/sukarn-ublue/dispatches \
#          -H 'Accept: application/vnd.github.everest-preview+json' \
#          -u ${{ secrets.PERSONAL_ACCESS_TOKEN }} \
#          --data '{"event_type": "Initiated from sukarn-os-base", "client_payload": { "repository": "'"$GITHUB_REPOSITORY"'" }}'

  # The 2026-08-17 build silently corrupted every files-module override of an
  # RPM-owned path (old content zero-padded to the new size). Verify the pushed
  # image's files-module content against the repo tree so a bad build fails loudly.
  # Only main/schedule/dispatch builds push :latest; branch and PR builds push
  # br-*/pr-* tags instead, so the gate runs only where :latest is the target.
  verify:
    name: Verify files in ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: bluebuild
    if: github.event_name != 'pull_request' && (github.event_name != 'push' || github.ref == 'refs/heads/main')
    permissions:
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - recipe: image-desktop.yml
            image: ghcr.io/sukarn-m/sukarn-ublue-desktop
            sources: system nas canon-lbp2900 tailscale theme-s trilium-notes desktop
          - recipe: image-laptop.yml
            image: ghcr.io/sukarn-m/sukarn-ublue-laptop
            sources: system nas canon-lbp2900 tailscale theme-s trilium-notes laptop device-e14g2
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Verify files-module content
        env:
          IMAGE: ${{ matrix.image }}
          SOURCES: ${{ matrix.sources }}
          TAG: latest
        run: |
          set -euo pipefail
          expected="$(mktemp)"
          for src in $SOURCES; do
            (cd "files/$src" && find . -type f -print0 | sort -z | xargs -0 sha256sum | sed 's~  \./~  /~') >> "$expected"
          done
          echo "Verifying $(wc -l < "$expected") files from sources: $SOURCES"
          podman pull "$IMAGE:$TAG"
          podman run --rm -i --entrypoint /usr/bin/bash "$IMAGE:$TAG" -c 'sha256sum -c --quiet' < "$expected"
          echo "All files-module content verified OK"
