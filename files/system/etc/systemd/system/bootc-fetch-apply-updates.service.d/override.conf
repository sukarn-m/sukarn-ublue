[Service]
ExecCondition=/usr/bin/sh -c 'if nmcli -t -f GENERAL.METERED dev show | grep -q yes; then exit 1; else exit 0; fi'
# No updates Monday to Saturday 11:00-11:59 and 18:00-20:59 (local time).
# systemd needs $$ for a literal $ and %% for a literal %.
ExecCondition=/usr/bin/bash -c 'day=$$(date +%%u); hour=$$((10#$$(date +%%H))); if (( day <= 6 )) && (( hour == 11 || (hour >= 18 && hour < 21) )); then echo "Blocked window (Mon-Sat 11:00-12:00, 18:00-21:00)"; exit 1; fi'
ExecStart=
ExecStart=/usr/bin/bootc update --quiet
